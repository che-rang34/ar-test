<!-- ============================================================

<script>
window.APP_CONFIG = {
  // iPhone용 Variant Launch 키. 가입 후 받은 key 값을 따옴표 안에 넣으세요. 비워 두면 iPhone은 꺼져 있어요.
  VARIANT_LAUNCH_KEY: '',

  // 캐릭터 파일. 내 모델로 바꿀 땐 'models/character.glb' 처럼 적으세요.
  MODEL_URL: 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r170/examples/models/gltf/RobotExpressive/RobotExpressive.glb',

  // AR에서 보일 캐릭터 키(미터). 0.3 = 30cm. null 로 두면 Blender에서 만든 크기 그대로예요.
  CHARACTER_HEIGHT: 0.3,

  // 평소에 반복할 대기 동작 이름
  IDLE: 'Idle',

  // 동작 목록. 시작 화면에서는 로봇을 터치하면 이 중 하나가 랜덤으로 나오고, AR에서는 버튼으로 나와요.
  // name 은 Blender 동작 이름과 철자·대소문자까지 같아야 해요.
  // loop: false = 한 번 하고 대기로 돌아감 / true = 다른 동작이 나올 때까지 반복
  ACTIONS: [
    { name: 'Wave', label: '👋 손 흔들기', loop: false },
    { name: 'Jump', label: '⬆️ 점프', loop: false },
    // { name: 'Dance', label: '💃 춤추기', loop: true },
  ],

  // 출동할 때(날아갈 때) 동작, AR에서 착륙한 직후 동작. 없으면 '' 로 두세요.
  LAUNCH_ACTION: 'Jump',
  LANDING_ACTION: 'Wave',
};

// Variant Launch(iPhone 지원) — 키가 있을 때만 불러와요. 3D 코드보다 먼저 실행돼야 해요.
if (window.APP_CONFIG.VARIANT_LAUNCH_KEY) {
  document.write('<script src="https://launchar.app/sdk/v1?key=' +
    encodeURIComponent(window.APP_CONFIG.VARIANT_LAUNCH_KEY) + '&redirect=true"><\/script>');
}
</script>

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Do Hyeon", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
  :root { --yellow: #f5c400; --plate: #2f2a26; --rim: #6b5d4e; --arBottom: 28px; } /* AR 버튼 높이: 화면 아래에서 띄울 거리 */
  body { background: #1a1614; color: #e9e6df; }
  body.ar { background: transparent; }
  canvas { display: block; position: fixed; inset: 0; touch-action: none; z-index: 1; }

  #overlay { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #overlay > * { pointer-events: auto; }

  /* 시작 화면: 철판 명판 */
  #intro { position: absolute; top: calc(22px + env(safe-area-inset-top)); left: 16px; right: 16px; pointer-events: none; }
  .plate { position: relative; max-width: 320px; padding: 14px 18px 12px; border-radius: 10px; background: var(--plate); border: 2px solid var(--rim); box-shadow: inset 0 2px 0 rgba(255,255,255,.06), 0 4px 0 #120f0d; }
  .plate::before, .plate::after { content: ""; position: absolute; top: 8px; width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #e0d6c4, #7d6f5e 70%); }
  .plate::before { left: 8px; } .plate::after { right: 8px; }
  .tag { display: inline-block; font-size: 12px; letter-spacing: 1px; color: #1b1b1b; background: var(--yellow); padding: 2px 8px; border-radius: 4px; }
  #intro h1 { margin: 6px 0 0; font-family: "Black Han Sans", sans-serif; font-weight: 400; font-size: 28px; line-height: 1.15; color: var(--yellow); text-shadow: 0 3px 0 #120f0d; }
  #intro p { margin: 6px 0 0; font-size: 15px; color: #d8cfc0; }
  .lamp { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #5cff8a; box-shadow: 0 0 8px #5cff8a; margin-right: 6px; animation: blink 1.4s steps(2) infinite; vertical-align: 1px; }
  @keyframes blink { 50% { opacity: .25; } }

  /* 터치 안내 */
  #tapHint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(104px + env(safe-area-inset-bottom)); background: rgba(0,0,0,.55); color: #fff; font-size: 16px; padding: 8px 16px; border-radius: 20px; white-space: nowrap; pointer-events: none; animation: bob 1.6s ease-in-out infinite; transition: opacity .4s; }
  #tapHint.dim { opacity: .45; }
  @keyframes bob { 50% { transform: translateX(-50%) translateY(-5px); } }

  /* 출동 버튼 */
  #arBtn { position: absolute; left: 20px; right: 20px; bottom: calc(30px + env(safe-area-inset-bottom)); height: 58px; border: 3px solid #1b1b1b; border-radius: 14px; background: var(--yellow); color: #1b1b1b; font-family: "Black Han Sans", sans-serif; font-size: 20px; box-shadow: 0 5px 0 #1b1b1b; }
  #arBtn:active { transform: translateY(4px); box-shadow: 0 1px 0 #1b1b1b; }
  #arBtn:disabled { background: #7b7f84; color: #2a2f35; }
  #note { position: absolute; left: 20px; right: 20px; bottom: calc(100px + env(safe-area-inset-bottom)); text-align: center; font-size: 15px; color: #ffb37a; }
  #note:not(:empty) ~ #tapHint { display: none; }
  body.ar #intro, body.ar #arBtn, body.ar #note, body.ar #tapHint, body.launching #tapHint { display: none; }

  /* 동작 버튼 (AR 전용) */
  #actions { position: absolute; left: 0; right: 0; bottom: calc(28px + env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 0 16px; }
  body:not(.ar) #actions, body.ar:not(.placed) #actions { display: none; }
  #actions button { font-family: inherit; border: 2px solid var(--yellow); background: rgba(30,27,24,.92); color: #fff; font-size: 17px; padding: 9px 16px; border-radius: 12px; box-shadow: 0 3px 0 #0e0c0a; }
  #actions button:active { transform: translateY(2px); box-shadow: 0 1px 0 #0e0c0a; }

  /* AR 안내 + 버튼 */
  #hint { position: absolute; top: calc(18px + env(safe-area-inset-top)); left: 16px; right: 64px; display: none; background: rgba(27,24,22,.78); border-left: 6px solid var(--yellow); color: #fff; font-size: 16px; padding: 10px 14px; text-align: left; }
  body.ar #hint { display: block; }
  #hint:empty { display: none !important; }
  #placeBtn, #moveBtn { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--arBottom) + env(safe-area-inset-bottom)); height: 54px; padding: 0 28px; border: 3px solid #1b1b1b; border-radius: 14px; font-family: "Black Han Sans", sans-serif; font-size: 18px; display: none; white-space: nowrap; }
  #placeBtn { background: var(--yellow); color: #1b1b1b; box-shadow: 0 4px 0 #1b1b1b; }
  #placeBtn.off { background: rgba(245,196,0,.4); color: rgba(0,0,0,.45); }
  #moveBtn { height: 40px; font-family: inherit; font-size: 15px; padding: 0 18px; border: 0; background: rgba(27,24,22,.72); color: #fff; }
  body.ar.overlay:not(.placed) #placeBtn { display: block; }
  body.ar.overlay.placed #moveBtn { display: block; }
  body.ar #actions { bottom: calc(var(--arBottom) + env(safe-area-inset-bottom)); }
  body.ar.overlay.placed #actions { bottom: calc(var(--arBottom) + 56px + env(safe-area-inset-bottom)); }
  #closeBtn { position: absolute; top: calc(16px + env(safe-area-inset-top)); right: 14px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(27,24,22,.72); color: #fff; font-size: 20px; display: none; }
  body.ar #closeBtn { display: block; }

  /* 증기 전환 효과 */
  #steamFx {
    position: absolute; inset: -10%; pointer-events: none !important; opacity: 0; transition: opacity .5s ease-in;
    background:
      radial-gradient(circle at 20% 25%, #fff 0 18%, transparent 42%),
      radial-gradient(circle at 75% 20%, #fff 0 16%, transparent 40%),
      radial-gradient(circle at 50% 55%, #fff 0 22%, transparent 48%),
      radial-gradient(circle at 15% 80%, #fff 0 18%, transparent 44%),
      radial-gradient(circle at 85% 78%, #fff 0 20%, transparent 46%),
      #e9e9e9;
  }
  #steamFx.on { opacity: 1; }
  #steamFx.reveal { transition: opacity 1.4s ease-out; }

  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--yellow); z-index: 5; }
</style>

<div id="overlay">

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const CFG = window.APP_CONFIG;
const $ = (id) => document.getElementById(id);
const ui = {
  overlay: $('overlay'), arBtn: $('arBtn'), note: $('note'), hint: $('hint'), actions: $('actions'),
  closeBtn: $('closeBtn'), loading: $('loading'), placeBtn: $('placeBtn'), moveBtn: $('moveBtn'),
  tapHint: $('tapHint'), steamFx: $('steamFx'),
};
const rand = (a, b) => a + Math.random() * (b - a);
const BG = 0x1a1614;

// ============================================================
// 기본 장면
// ============================================================
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.xr.enabled = true;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 60);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minPolarAngle = 0.35;
controls.maxPolarAngle = Math.PI * 0.53;
controls.addEventListener('start', () => { controls.autoRotate = false; });

// 금속이 반짝이도록 주변 반사 환경
const envMap = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envMap;
scene.environmentIntensity = 0.35;

const hemi = new THREE.HemisphereLight(0xfff1dc, 0x3a2a20, 0.6);
scene.add(hemi);

// root = 바닥 위치(AR에서 옮겨지는 묶음) / body = 로봇 자체(날아가기·떨어지기 연출용)
const root = new THREE.Group();
const body = new THREE.Group();
root.add(body);
scene.add(root);

const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
root.add(sun, sun.target);

const stand = new THREE.Group();   // 미리보기 전용 조립대
root.add(stand);

const reticle = new THREE.Mesh(
  new THREE.RingGeometry(0.06, 0.075, 40).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0xffffff })
);
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);

// ============================================================
// 텍스처 (그림 파일 없이 코드로 그려요)
// ============================================================
function canvasTex(size, draw, repeatX = 1, repeatY = 1) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX, repeatY);
  t.anisotropy = 4;
  return t;
}
const gratingTex = canvasTex(128, (g, s) => {
  g.fillStyle = '#2b2724'; g.fillRect(0, 0, s, s);
  g.fillStyle = '#16120f';
  for (let y = 4; y < s; y += 16) for (let x = 4; x < s; x += 16) g.fillRect(x, y, 10, 10);
  g.strokeStyle = '#4a423b'; g.lineWidth = 2;
  g.strokeRect(1, 1, s - 2, s - 2);
}, 12, 12);
const wallTex = canvasTex(256, (g, s) => {
  g.fillStyle = '#241e1a'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(${60 + Math.random() * 40},${40 + Math.random() * 20},20,0.08)`; g.fillRect(Math.random() * s, Math.random() * s, 30 + Math.random() * 60, 20 + Math.random() * 50); }
  g.fillStyle = '#14100d';
  g.fillRect(0, 0, 5, s); g.fillRect(s / 2, 0, 5, s); g.fillRect(0, s / 2, s, 5);
  g.fillStyle = '#5a4c40';
  for (let y = 12; y < s; y += 24) { g.beginPath(); g.arc(10, y, 2.5, 0, 7); g.arc(s / 2 + 10, y, 2.5, 0, 7); g.fill(); }
}, 14, 3);
const steamTex = canvasTex(64, (g, s) => {
  const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  gr.addColorStop(0, 'rgba(255,255,255,0.9)');
  gr.addColorStop(0.4, 'rgba(255,255,255,0.45)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
});

// ============================================================
// 보일러실 (로봇 키 = 1 기준으로 만들고, 나중에 로봇 크기에 맞춰 통째로 키워요)
// ============================================================
const env = new THREE.Group();
scene.add(env);
const FLOOR = -0.13;
const M = {
  brass: new THREE.MeshStandardMaterial({ color: 0x9a8468, metalness: 0.8, roughness: 0.35 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x3a3430, metalness: 0.6, roughness: 0.5 }),
  rust: new THREE.MeshStandardMaterial({ color: 0x8a4a24, metalness: 0.5, roughness: 0.55 }),
  steel: new THREE.MeshStandardMaterial({ color: 0x5b6168, metalness: 0.85, roughness: 0.3 }),
  red: new THREE.MeshStandardMaterial({ color: 0xd6362a, metalness: 0.3, roughness: 0.45 }),
  cream: new THREE.MeshBasicMaterial({ color: 0xe9e1cf }),
};
let furnaceLight, steamEmitters = [];

function facing(obj, x, z, r, y, angleOffset = 0) {
  // 원통 표면에서 가운데(로봇 쪽)를 바라보는 자리에 붙이기
  const a = Math.atan2(-x, -z) + angleOffset;
  const dir = new THREE.Vector3(Math.sin(a), 0, Math.cos(a));
  obj.position.set(x + dir.x * r, y, z + dir.z * r);
  obj.lookAt(obj.position.clone().add(dir));
}

function makeBoiler(x, z, r, h, opt = {}) {
  const g = new THREE.Group();
  const bodyM = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 48), M.brass);
  bodyM.position.set(x, FLOOR + h / 2, z);
  const top = new THREE.Mesh(new THREE.SphereGeometry(r, 48, 16, 0, Math.PI * 2, 0, Math.PI / 2), M.brass);
  top.position.set(x, FLOOR + h, z);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.12, r * 1.18, 0.3, 48), M.dark);
  base.position.set(x, FLOOR + 0.15, z);
  g.add(bodyM, top, base);
  for (const fy of [0.25, 0.5, 0.78]) {
    const band = new THREE.Mesh(new THREE.TorusGeometry(r * 1.005, 0.045, 8, 64).rotateX(Math.PI / 2), M.dark);
    band.position.set(x, FLOOR + h * fy, z);
    g.add(band);
  }
  const vent = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.5, 16), M.steel);
  vent.position.set(x, FLOOR + h + r * 0.9, z);
  g.add(vent);
  steamEmitters.push({ p: new THREE.Vector3(x, FLOOR + h + r * 0.9 + 0.3, z), dir: new THREE.Vector3(0, 1, 0), speed: 1.4, size: 1.1, life: 2.6, rate: 16, gap: [3, 6] });

  if (opt.gauge) {
    const gauge = new THREE.Group();
    gauge.add(new THREE.Mesh(new THREE.CircleGeometry(0.2, 32), M.cream));
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.035, 8, 32), M.dark);
    const needle = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.15, 0.01), M.red);
    needle.position.set(0.03, 0.04, 0.01); needle.rotation.z = -0.7;
    gauge.add(ring, needle);
    facing(gauge, x, z, r + 0.03, FLOOR + h * 0.55, 0.25);
    g.add(gauge);
  }
  if (opt.valve) {
    const valve = new THREE.Group();
    valve.add(new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.04, 8, 32), M.red));
    valve.add(new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.04, 0.04), M.red));
    valve.add(new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.46, 0.04), M.red));
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.18, 8).rotateX(Math.PI / 2), M.steel);
    stem.position.z = -0.09;
    valve.add(stem);
    facing(valve, x, z, r + 0.12, FLOOR + h * 0.35, -0.3);
    g.add(valve);
  }
  return g;
}

function pipe(points, radius, mat, joints = true) {
  const curve = new THREE.CatmullRomCurve3(points.map((p) => new THREE.Vector3(...p)), false, 'catmullrom', 0.08);
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 64, radius, 16, false), mat));
  if (joints) {
    for (const t of [0.0, 0.5, 1.0]) {
      const p = curve.getPointAt(t), tan = curve.getTangentAt(t);
      const flange = new THREE.Mesh(new THREE.CylinderGeometry(radius * 1.5, radius * 1.5, radius * 0.8, 16), M.dark);
      flange.position.copy(p);
      flange.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tan);
      g.add(flange);
    }
  }
  return { mesh: g, curve };
}

function buildEnvironment() {
  // 바닥 · 벽 · 천장
  const floor = new THREE.Mesh(new THREE.CircleGeometry(7, 64).rotateX(-Math.PI / 2),
    new THREE.MeshStandardMaterial({ map: gratingTex, metalness: 0.5, roughness: 0.75 }));
  floor.position.y = FLOOR;
  const wall = new THREE.Mesh(new THREE.CylinderGeometry(7, 7, 9, 64, 1, true),
    new THREE.MeshStandardMaterial({ map: wallTex, side: THREE.BackSide, metalness: 0.2, roughness: 0.9 }));
  wall.position.y = FLOOR + 4.5;
  const ceil = new THREE.Mesh(new THREE.CircleGeometry(7, 48).rotateX(Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x120e0c, roughness: 1 }));
  ceil.position.y = FLOOR + 7;
  env.add(floor, wall, ceil);

  // 보일러 탱크
  env.add(makeBoiler(-2.7, -2.9, 0.95, 4.2, { gauge: true }));
  env.add(makeBoiler(2.9, -2.3, 1.05, 4.7, { gauge: true, valve: true }));
  env.add(makeBoiler(-3.9, 1.0, 0.6, 2.6, { valve: true }));
  env.add(makeBoiler(4.0, 1.6, 0.55, 2.2, {}));

  // 배관
  const p1 = pipe([[1.95, 3.2, -2.3], [0.9, 3.2, -2.3], [0.4, 3.5, -2.6], [0.35, 6.9, -3.0]], 0.14, M.rust);
  const p2 = pipe([[-1.85, 1.7, -2.9], [-1.3, 1.6, -3.5], [-0.9, 1.0, -4.1]], 0.12, M.steel);
  const p3 = pipe([[-5.3, 2.7, -4.6], [0, 2.9, -5.2], [5.3, 2.7, -4.6]], 0.11, M.steel);
  const p4 = pipe([[-3.4, 0.5, 1.1], [-2.5, 0.3, 1.0], [-1.8, FLOOR + 0.05, 0.9]], 0.1, M.rust);
  const p5 = pipe([[3.5, 1.3, 1.7], [3.4, 2.4, 0.4], [3.6, 2.6, -1.4]], 0.1, M.rust);
  env.add(p1.mesh, p2.mesh, p3.mesh, p4.mesh, p5.mesh);
  steamEmitters.push({ p: p3.curve.getPointAt(0.5), dir: new THREE.Vector3(0.3, 1, 0.4), speed: 0.9, size: 0.8, life: 2.2, rate: 12, gap: [4, 7] });
  steamEmitters.push({ p: p1.curve.getPointAt(0.5), dir: new THREE.Vector3(-0.6, 0.8, 0.3), speed: 1.0, size: 0.7, life: 1.8, rate: 14, gap: [5, 8] });
  steamEmitters.push({ p: new THREE.Vector3(-1.8, FLOOR + 0.05, 0.9), dir: new THREE.Vector3(0, 1, 0), speed: 0.7, size: 0.9, life: 2.4, rate: 8, gap: [2, 4] });
  steamEmitters.push({ p: new THREE.Vector3(1.9, FLOOR + 0.05, 1.4), dir: new THREE.Vector3(0, 1, 0), speed: 0.6, size: 0.9, life: 2.4, rate: 6, gap: [3, 5] });

  // 화로
  const furnace = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.1, 1.1), M.dark);
  furnace.position.set(0, FLOOR + 1.05, -4.9);
  const chimney = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.35, 5, 24), M.dark);
  chimney.position.set(0, FLOOR + 4.6, -5.1);
  const fire = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 0.9), new THREE.MeshBasicMaterial({ color: 0xff7a1a }));
  fire.position.set(0, FLOOR + 0.85, -4.34);
  const fireCore = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.5), new THREE.MeshBasicMaterial({ color: 0xffc06a }));
  fireCore.position.set(0, FLOOR + 0.7, -4.335);
  env.add(furnace, chimney, fire, fireCore);
  for (const bx of [-0.4, 0, 0.4]) {
    const bar = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.95, 0.06), M.dark);
    bar.position.set(bx, FLOOR + 0.85, -4.31);
    env.add(bar);
  }
  furnaceLight = new THREE.PointLight(0xff8a2a, 3, 0, 2);
  furnaceLight.position.set(0, FLOOR + 1.0, -3.6);
  env.add(furnaceLight);

  // 천장 조명 (로봇 위)
  const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 3.0, 6), M.dark);
  cord.position.set(0, FLOOR + 5.5, 0);
  const shade = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.35, 32, 1, true), new THREE.MeshStandardMaterial({ color: 0x4a3f36, metalness: 0.6, roughness: 0.4, side: THREE.DoubleSide }));
  shade.position.set(0, FLOOR + 3.9, 0);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 8), new THREE.MeshBasicMaterial({ color: 0xffe0a0 }));
  bulb.position.set(0, FLOOR + 3.75, 0);
  const beam = new THREE.Mesh(new THREE.ConeGeometry(1.25, 3.6, 40, 1, true),
    new THREE.MeshBasicMaterial({ color: 0xffcf7a, transparent: true, opacity: 0.06, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
  beam.position.set(0, FLOOR + 3.75 - 1.8, 0);
  env.add(cord, shade, bulb, beam);
  const spot = new THREE.SpotLight(0xffd9a0, 10, 0, 0.55, 0.6, 2);
  spot.position.set(0, FLOOR + 3.7, 0);
  spot.target.position.set(0, 0, 0);
  env.add(spot, spot.target);

  // 오른쪽 벽 쪽 작은 램프 (분위기)
  const sideLight = new THREE.PointLight(0xffb070, 1.2, 0, 2);
  sideLight.position.set(3.5, 3.2, -0.5);
  env.add(sideLight);

  steamEmitters.forEach((e) => { e.dir.normalize(); e.next = rand(0.2, 2.5); e.burst = 0; e.acc = 0; });
}
buildEnvironment();

// ============================================================
// 수증기
// ============================================================
const puffs = [];
for (let i = 0; i < 160; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: steamTex, color: 0xf0eeea, transparent: true, depthWrite: false, opacity: 0 }));
  s.visible = false;
  scene.add(s);
  puffs.push({ s, life: 0, max: 1, vel: new THREE.Vector3(), size: 1, op: 0.5 });
}
let puffCursor = 0;
function emitPuff(pos, vel, size, life, op) {
  const p = puffs[puffCursor++ % puffs.length];
  p.s.position.copy(pos);
  p.vel.copy(vel);
  p.size = size; p.life = p.max = life; p.op = op;
  p.s.material.rotation = Math.random() * Math.PI * 2;
  p.s.visible = true;
}
function updatePuffs(dt) {
  for (const p of puffs) {
    if (p.life <= 0) continue;
    p.life -= dt;
    if (p.life <= 0) { p.s.visible = false; continue; }
    const k = 1 - p.life / p.max;
    p.s.position.addScaledVector(p.vel, dt);
    p.vel.multiplyScalar(1 - 0.9 * dt);
    p.s.scale.setScalar(p.size * (0.35 + 1.4 * k));
    p.s.material.opacity = p.op * (k < 0.12 ? k / 0.12 : (1 - k) / 0.88);
  }
}
const _v = new THREE.Vector3(), _d = new THREE.Vector3();
function emitFrom(e, s, strength = 1) {
  _v.copy(e.p); env.localToWorld(_v);
  _d.copy(e.dir).multiplyScalar(e.speed * s * strength);
  _d.x += rand(-0.25, 0.25) * s; _d.z += rand(-0.25, 0.25) * s; _d.y += rand(-0.1, 0.2) * s;
  emitPuff(_v, _d, e.size * s * rand(0.7, 1.2), e.life * rand(0.8, 1.2), 0.5);
}
function updateEmitters(dt) {
  const s = env.scale.x;
  for (const e of steamEmitters) {
    e.next -= dt;
    if (e.next <= 0) { e.burst = rand(0.6, 1.4); e.next = rand(e.gap[0], e.gap[1]); }
    if (e.burst > 0) {
      e.burst -= dt;
      e.acc += dt * e.rate;
      while (e.acc >= 1) { e.acc -= 1; emitFrom(e, s); }
    }
  }
}
function steamBurstAll() {
  const s = env.scale.x;
  for (const e of steamEmitters) for (let i = 0; i < 10; i++) emitFrom(e, s, 1.6);
}
function landingPuff(pos, h) {
  for (let i = 0; i < 18; i++) {
    const a = (i / 18) * Math.PI * 2;
    _d.set(Math.cos(a) * h * rand(1.0, 1.6), h * rand(0.15, 0.45), Math.sin(a) * h * rand(1.0, 1.6));
    emitPuff(_v.copy(pos).setY(pos.y + h * 0.05), _d, h * rand(0.35, 0.55), rand(0.8, 1.3), 0.55);
  }
}

// ============================================================
// 간단한 애니메이션 도구
// ============================================================
const tweens = [];
function tween(dur, fn, done) { tweens.push({ t: 0, dur, fn, done }); }
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.t += dt;
    const k = Math.min(1, tw.t / tw.dur);
    tw.fn(k);
    if (k >= 1) { tweens.splice(i, 1); tw.done && tw.done(); }
  }
}
const easeIn = (k) => k * k;
const easeOutBack = (k) => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };

// ============================================================
// 캐릭터 불러오기
// ============================================================
let mixer = null, clips = {}, current = null, idleAction = null, charHeight = 1, hitbox = null;

function applyScale(h) {
  charHeight = h;
  env.scale.setScalar(h);
  sun.position.set(h * 0.8, h * 3, h * 1.2);
  Object.assign(sun.shadow.camera, { left: -h * 1.5, right: h * 1.5, top: h * 1.5, bottom: -h * 1.5, near: h * 0.1, far: h * 10 });
  sun.shadow.camera.updateProjectionMatrix();
  scene.fog = new THREE.Fog(BG, h * 5, h * 15);
  camera.position.set(h * 0.6, h * 0.85, h * 3.4);
  controls.target.set(0, h * 0.5, 0);
  controls.minDistance = h * 1.6;
  controls.maxDistance = h * 5.5;
  controls.update();
}
applyScale(CFG.CHARACTER_HEIGHT || 0.3);
scene.background = new THREE.Color(BG);

const draco = new DRACOLoader().setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
new GLTFLoader().setDRACOLoader(draco).load(CFG.MODEL_URL, (gltf) => {
  const model = gltf.scene;
  model.traverse((o) => { if (o.isMesh) o.castShadow = true; });

  let box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  if (CFG.CHARACTER_HEIGHT && size.y > 0) model.scale.multiplyScalar(CFG.CHARACTER_HEIGHT / size.y);
  box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  model.position.x -= center.x;
  model.position.z -= center.z;
  model.position.y -= box.min.y;
  const h = box.max.y - box.min.y;
  body.add(model);
  applyScale(h);

  // 터치 판정용 투명 기둥
  hitbox = new THREE.Mesh(new THREE.CylinderGeometry(h * 0.45, h * 0.45, h, 12), new THREE.MeshBasicMaterial({ visible: false }));
  hitbox.position.y = h / 2;
  body.add(hitbox);

  // 바닥 그림자
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(h * 3, h * 3).rotateX(-Math.PI / 2), new THREE.ShadowMaterial({ opacity: 0.3 }));
  shadow.receiveShadow = true;
  shadow.position.y = 0.001;
  root.add(shadow);

  // 조립대
  const deck = new THREE.Mesh(new THREE.CylinderGeometry(h * 0.7, h * 0.74, h * 0.08, 48), new THREE.MeshStandardMaterial({ color: 0x5a4e42, metalness: 0.7, roughness: 0.45 }));
  deck.position.y = -h * 0.04;
  deck.receiveShadow = true;
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(h * 0.8, h * 0.84, h * 0.05, 48), new THREE.MeshStandardMaterial({ color: 0xf5c400, metalness: 0.2, roughness: 0.6 }));
  rim.position.y = -h * 0.105;
  stand.add(deck, rim);

  // 애니메이션
  mixer = new THREE.AnimationMixer(model);
  gltf.animations.forEach((c) => { clips[c.name] = c; });
  console.log('이 모델에 들어 있는 동작:', Object.keys(clips).join(', ') || '(없음)');
  if (clips[CFG.IDLE]) {
    idleAction = mixer.clipAction(clips[CFG.IDLE]);
    idleAction.play();
    current = idleAction;
  }
  mixer.addEventListener('finished', (e) => { if (e.action === current && idleAction) fadeTo(idleAction); });

  ui.loading.remove();
}, undefined, (err) => {
  console.error(err);
  ui.loading.textContent = '부품(모델 파일)을 못 찾았어요. MODEL_URL 을 확인해 주세요.';
});

function fadeTo(next) {
  if (current && current !== next) current.fadeOut(0.25);
  next.reset().fadeIn(0.25).play();
  current = next;
}
function playByName(name, loop = false) {
  if (!mixer || !name || !clips[name]) return false;
  const a = mixer.clipAction(clips[name]);
  a.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
  a.clampWhenFinished = true;
  fadeTo(a);
  return true;
}
function playAction(cfg) {
  if (!mixer) return;
  if (!playByName(cfg.name, cfg.loop)) showHint(`'${cfg.name}' 동작이 모델에 없어요`, 2000);
}
let lastRandom = null;
function playRandom() {
  const pool = CFG.ACTIONS.filter((a) => clips[a.name]);
  if (!pool.length) return;
  const choices = pool.length > 1 ? pool.filter((a) => a !== lastRandom) : pool;
  lastRandom = choices[Math.floor(Math.random() * choices.length)];
  playAction(lastRandom);
}

// ============================================================
// 시작 화면: 로봇 터치 → 랜덤 동작
// ============================================================
const raycaster = new THREE.Raycaster();
let down = null, taps = 0;
renderer.domElement.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || renderer.xr.isPresenting || launching || !hitbox) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  if (moved > 10 || performance.now() - down.t > 450) return;
  const p = new THREE.Vector2((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(p, camera);
  if (raycaster.intersectObject(hitbox, false).length) {
    playRandom();
    if (++taps >= 2) ui.tapHint.classList.add('dim');
  }
});

// ============================================================
// AR 동작 버튼
// ============================================================
CFG.ACTIONS.forEach((cfg) => {
  const b = document.createElement('button');
  b.textContent = cfg.label;
  b.addEventListener('click', () => playAction(cfg));
  ui.actions.appendChild(b);
});
ui.overlay.addEventListener('beforexrselect', (e) => e.preventDefault());

let hintTimer = null;
function showHint(text, ms) {
  ui.hint.textContent = text;
  clearTimeout(hintTimer);
  if (ms) hintTimer = setTimeout(() => { if (placed) ui.hint.textContent = ''; }, ms);
}

// ============================================================
// AR 지원 확인
// ============================================================
let mode = 'none';
let vlaunch = null;
window.addEventListener('vlaunch-initialized', (e) => { vlaunch = e.detail; checkSupport(); });

async function checkSupport() {
  if (vlaunch && vlaunch.launchRequired) mode = 'launch';
  else if (navigator.xr) mode = (await navigator.xr.isSessionSupported('immersive-ar').catch(() => false)) ? 'xr' : 'none';
  else mode = 'none';
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  ui.arBtn.disabled = mode === 'none';
  ui.arBtn.textContent = mode === 'none' ? 'AR 사용 불가' : '⚙ 우리 집으로 출동!';
  ui.note.textContent = mode !== 'none' ? '' :
    isIOS ? (CFG.VARIANT_LAUNCH_KEY ? 'iPhone AR을 준비하고 있어요. 잠시 후 다시 시도해 주세요.' : 'iPhone AR은 아직 연결 전이에요 (Variant Launch 키 필요).')
          : '이 기기나 브라우저는 AR을 지원하지 않아요. Android 폰의 Chrome에서 열어 주세요.';
}
checkSupport();

// ============================================================
// 출동 연출: 점프 → 날아감 → 증기로 화면 덮기 → AR 시작
// ============================================================
let launching = false;
ui.arBtn.addEventListener('click', () => {
  if (launching || mode === 'none') return;
  launching = true;
  document.body.classList.add('launching');
  ui.arBtn.disabled = true;
  controls.autoRotate = false;

  const h = charHeight;
  const hasLaunch = playByName(CFG.LAUNCH_ACTION);
  steamBurstAll();
  setTimeout(() => {
    tween(0.7, (k) => { body.position.y = easeIn(k) * h * 5; });
  }, hasLaunch ? 250 : 0);
  setTimeout(() => ui.steamFx.classList.add('on'), 450);

  setTimeout(() => {
    if (mode === 'launch') {
      window.location.href = (window.VLaunch && VLaunch.getLaunchUrl) ? VLaunch.getLaunchUrl(window.location.href) : vlaunch.launchUrl;
      return;
    }
    startAR().catch((err) => {
      console.error(err);
      resetPreview();
      ui.note.textContent = 'AR을 시작하지 못했어요: ' + err.message;
    });
  }, 1000);
});

function resetPreview() {
  launching = false;
  document.body.classList.remove('launching');
  ui.arBtn.disabled = mode === 'none';
  ui.steamFx.classList.remove('reveal', 'on');
  body.position.y = 0;
  body.scale.set(1, 1, 1);
  if (idleAction) fadeTo(idleAction);
}

// ============================================================
// AR
// ============================================================
let hitSource = null, placed = false, hasOverlay = false, actionCursor = 0;

async function startAR() {
  const session = await navigator.xr.requestSession('immersive-ar', {
    requiredFeatures: ['local', 'hit-test'],
    optionalFeatures: ['dom-overlay'],
    domOverlay: { root: ui.overlay },
  });
  renderer.xr.setReferenceSpaceType('local');
  await renderer.xr.setSession(session);
  hasOverlay = !!session.domOverlayState;

  const viewerSpace = await session.requestReferenceSpace('viewer');
  hitSource = await session.requestHitTestSource({ space: viewerSpace });

  // 보일러실은 숨기고 실제 방 위에 로봇만
  env.visible = false;
  stand.visible = false;
  scene.background = null;
  scene.fog = null;
  scene.environmentIntensity = 0.8;
  hemi.intensity = 2.2;
  sun.intensity = 2.2;
  puffs.forEach((p) => { p.life = 0; p.s.visible = false; });

  placed = false;
  root.visible = false;
  body.position.y = 0;
  controls.enabled = false;
  launching = false;
  document.body.classList.remove('launching', 'placed');
  document.body.classList.add('ar');
  document.body.classList.toggle('overlay', hasOverlay);
  showHint('삐빅… 착륙할 바닥을 스캔 중! 폰을 천천히 좌우로 움직여 주세요');

  // 증기가 걷히면서 내 방이 보이게
  setTimeout(() => { ui.steamFx.classList.add('reveal'); ui.steamFx.classList.remove('on'); }, 350);

  session.addEventListener('select', onSelect);
  session.addEventListener('end', onEnd);
}

// 화면 탭: 착륙 전에는 어디를 눌러도 링 위치에 착륙. 착륙 후에는 아무 일도 안 해요.
// (버튼을 띄울 수 없는 환경에서만, 착륙 후 탭할 때마다 동작 재생)
function onSelect() {
  if (!placed) { placeHere(); return; }
  if (!hasOverlay && CFG.ACTIONS.length) playAction(CFG.ACTIONS[actionCursor++ % CFG.ACTIONS.length]);
}

ui.placeBtn.addEventListener('click', () => {
  if (!reticle.visible) { showHint('아직 착륙할 바닥을 못 찾았어요. 바닥을 비춰 주세요', 2000); return; }
  placeHere();
});
ui.moveBtn.addEventListener('click', () => {
  placed = false;
  root.visible = false;
  document.body.classList.remove('placed');
  showHint('새 착륙 지점에 링을 맞추고 화면을 탭하세요');
});

function placeHere() {
  if (!reticle.visible) return;
  const h = charHeight;
  root.position.setFromMatrixPosition(reticle.matrix);
  const cam = new THREE.Vector3().setFromMatrixPosition(renderer.xr.getCamera().matrixWorld);
  root.rotation.set(0, Math.atan2(cam.x - root.position.x, cam.z - root.position.z), 0);
  root.visible = true;
  placed = true;
  reticle.visible = false;
  document.body.classList.add('placed');
  showHint(hasOverlay ? '' : '화면을 탭하면 동작해요', 2500);

  // 위에서 쿵! 떨어지기 → 찌그러졌다 펴지기 → 증기 → 인사
  body.position.y = h * 3;
  body.scale.set(1, 1, 1);
  tween(0.5, (k) => { body.position.y = h * 3 * (1 - easeIn(k)); }, () => {
    landingPuff(root.position, h);
    tween(0.35, (k) => {
      const e = easeOutBack(k);
      const sy = 0.78 + 0.22 * e;
      body.scale.set(1 + (1 - sy) * 0.6, sy, 1 + (1 - sy) * 0.6);
    });
    setTimeout(() => playByName(CFG.LANDING_ACTION), 250);
  });
}

function onEnd() {
  hitSource = null;
  placed = false;
  reticle.visible = false;
  ui.placeBtn.classList.add('off');
  root.position.set(0, 0, 0);
  root.rotation.set(0, 0, 0);
  root.visible = true;
  env.visible = true;
  stand.visible = true;
  scene.background = new THREE.Color(BG);
  scene.fog = new THREE.Fog(BG, charHeight * 5, charHeight * 15);
  scene.environmentIntensity = 0.35;
  hemi.intensity = 0.6;
  sun.intensity = 1.2;
  controls.enabled = true;
  document.body.classList.remove('ar', 'placed', 'overlay');
  ui.hint.textContent = '';
  resetPreview();
  onResize();
}

ui.closeBtn.addEventListener('click', () => renderer.xr.getSession()?.end());

// ============================================================
// 매 프레임
// ============================================================
const clock = new THREE.Clock();
let elapsed = 0;
renderer.setAnimationLoop((t, frame) => {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  if (mixer) mixer.update(dt);
  updateTweens(dt);
  updatePuffs(dt);

  if (env.visible) {
    updateEmitters(dt);
    if (furnaceLight) furnaceLight.intensity = 3 * (0.8 + 0.15 * Math.sin(elapsed * 9) + 0.1 * Math.sin(elapsed * 23.7));
  }

  if (frame && hitSource) {
    if (!placed) {
      const hits = frame.getHitTestResults(hitSource);
      const found = hits.length > 0;
      if (found) reticle.matrix.fromArray(hits[0].getPose(renderer.xr.getReferenceSpace()).transform.matrix);
      if (found !== reticle.visible) {
        reticle.visible = found;
        ui.placeBtn.classList.toggle('off', !found);
        if (found) showHint(hasOverlay ? '착륙 지점 발견! 화면 아무 곳이나 탭하면 링 위치에 착륙해요' : '링이 보이는 곳을 탭하면 로봇이 착륙해요');
      }
    }
  } else {
    controls.update();
  }
  renderer.render(scene, camera);
});

function onResize() {
  if (renderer.xr.isPresenting) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);
// iPhone에서 뒤로 가기로 돌아왔을 때 증기 화면이 남지 않게
